# Published through Traefik on :3000 (entrypoint defined in infra/k8s/traefik-values.yaml)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: langfuse
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000
