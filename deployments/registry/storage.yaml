apiVersion: v1
kind: PersistentVolume
metadata:
  name: docker-registry-data
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: docker-registry
    name: docker-registry-pvc
  hostPath:
    path: /home/paulius/docker-registry
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-registry-pvc
  namespace: docker-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: docker-registry-data
  resources:
    requests:
      storage: 100Gi
